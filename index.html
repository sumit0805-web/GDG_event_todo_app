<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taskboard</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <div class="grain"></div>

  <main class="app">

    <header class="header">
      <div class="header-top">
        <span class="label">TASKBOARD</span>
        <span class="date" id="currentDate"></span>
      </div>
      <h1 class="title">What needs<br/><em>doing?</em></h1>
      <div class="stats">
        <span id="remainingCount">0</span> remaining &nbsp;·&nbsp;
        <span id="doneCount">0</span> done
      </div>
    </header>

    <div class="input-row">
      <input
        type="text"
        id="taskInput"
        class="task-input"
        placeholder="Add a new task…"
        maxlength="120"
        autocomplete="off"
      />
      <button class="add-btn" id="addBtn" aria-label="Add task">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <line x1="10" y1="3" x2="10" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="3" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <ul class="task-list" id="taskList">
      <!-- tasks injected here -->
    </ul>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">✦</div>
      <p>Nothing here yet.<br/>Add your first task above.</p>
    </div>

    <footer class="footer">
      <button class="clear-btn" id="clearDoneBtn">Clear completed</button>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
